server:
  forward-headers-strategy: framework

spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_ID}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  ai:
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY:${OPENAI_API_KEY:}}

  # 파일 업로드 용량 설정 (테스트 영상 업로드용 50MB)
  # 실제 운영 환경에선 500MB로 늘릴 예정
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  cloud:
    aws:
      s3:
        bucket: ${AWS_S3_BUCKET}
      region:
        static: ap-northeast-2
      credentials:
        access-key: ${AWS_ACCESS_KEY:${AWS_ACCESS_KEY_ID:}}
        secret-key: ${AWS_SECRET_KEY:${AWS_SECRET_ACCESS_KEY:}}

oauth2:
  kakao:
    client-id: ${KAKAO_CLIENT_ID}          # REST API 키
    redirect-uri: ${KAKAO_REDIRECT_URI}
    authorization-uri: ${KAKAO_AUTHORIZATION_URI}
    token-uri: ${KAKAO_TOKEN_URI}
    user-info-uri: ${KAKAO_USERINFO_URI}
    app-deep-link-uri: ${KAKAO_APP_DEEPLINK_URI}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_REDIRECT_URI}
    authorization-uri: ${GOOGLE_AUTHORIZATION_URI}
    token-uri: ${GOOGLE_TOKEN_URI}
    user-info-uri: ${GOOGLE_USERINFO_URI}
    app-deep-link-uri: ${GOOGLE_APP_DEEPLINK_URI}
  naver:
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}
    redirect-uri: ${NAVER_REDIRECT_URI}
    authorization-uri: ${NAVER_AUTHORIZATION_URI}
    token-uri: ${NAVER_TOKEN_URI}
    user-info-uri: ${NAVER_USERINFO_URI}
    app-deep-link-uri: ${NAVER_APP_DEEPLINK_URI}

jwt:
  secret: ${JWT_SECRET_KEY}
  access-token-expiration-ms: 3600000
  refresh-token-expiration-ms: 1209600000

app:
  cors:
    allowed-origins:
      - http://localhost:3000
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    allow-credentials: true

  activity-sync:
    default-region-id: ${ACTIVITY_SYNC_DEFAULT_REGION_ID:1}
    default-max-pages: ${ACTIVITY_SYNC_DEFAULT_MAX_PAGES:1}
    months-ahead: ${ACTIVITY_SYNC_MONTHS_AHEAD:1}
    kopis:
      base-url: ${KOPIS_BASE_URL:${KOPIS_API_BASE_URL:https://www.kopis.or.kr/openApi/restful/pblprfr}}
      service-key: ${KOPIS_SERVICE_KEY:${KOPIS_API_SERVICE_KEY:}}
      max-pages: ${KOPIS_MAX_PAGES:1}
    exhibition:
      base-url: ${EXHIBITION_BASE_URL:${EXHIBITION_API_BASE_URL:https://api.kcisa.kr/openapi/API_CCA_145/request}}
      service-key: ${EXHIBITION_SERVICE_KEY:${EXHIBITION_API_SERVICE_KEY:}}
      max-pages: ${EXHIBITION_MAX_PAGES:1}
    seoul-culture:
      base-url: ${SEOUL_CULTURE_BASE_URL:${SEOUL_CULTURE_API_BASE_URL:}}
      max-pages: ${SEOUL_CULTURE_MAX_PAGES:1}
    seoul-reservation:
      base-url: ${SEOUL_RESERVATION_BASE_URL:${SEOUL_RESERVATION_API_BASE_URL:}}
      max-pages: ${SEOUL_RESERVATION_MAX_PAGES:1}

  discovery:
    search:
      provider: serper
      serper:
        base-url: https://google.serper.dev/search
        api-key: ${SERPER_API_KEY:}
        gl: kr
        hl: ko
    publish:
      fixed-delay-ms: 300000
    sheets:
      enabled: ${GOOGLE_SHEETS_ENABLED:true}
      spreadsheet-id: ${GOOGLE_SHEETS_SPREADSHEET_ID:}
      sheet-name: 찍먹활동DB
      credentials-path: ${GOOGLE_SHEETS_CREDENTIALS_PATH:}
      credentials-json: ${GOOGLE_SHEETS_CREDENTIALS_JSON:}
