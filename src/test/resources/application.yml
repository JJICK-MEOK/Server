spring:
  flyway:
    enabled: false

  ai:
    openai:
      api-key: test-openai-key

  cloud:
    aws:
      region:
        static: ap-northeast-2
      s3:
        bucket: test-bucket
      credentials:
        access-key: test-access-key
        secret-key: test-secret-key

  mail:
    host: smtp.gmail.com
    port: 587
    username: test@example.com
    password: test-mail-password

oauth2:
  kakao:
    client-id: test-kakao-client-id
    redirect-uri: http://localhost:8080/api/v1/oauth/kakao/callback
    authorization-uri: https://kauth.kakao.com/oauth/authorize
    token-uri: https://kauth.kakao.com/oauth/token
    user-info-uri: https://kapi.kakao.com/v2/user/me
    app-deep-link-uri: jjikmeok://oauth/kakao

  google:
    client-id: test-google-client-id
    client-secret: test-google-client-secret
    redirect-uri: http://localhost:8080/api/v1/oauth/google/callback
    authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
    token-uri: https://oauth2.googleapis.com/token
    user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
    app-deep-link-uri: jjikmeok://oauth/google

  naver:
    client-id: test-naver-client-id
    client-secret: test-naver-client-secret
    redirect-uri: http://localhost:8080/api/v1/oauth/naver/callback
    authorization-uri: https://nid.naver.com/oauth2.0/authorize
    token-uri: https://nid.naver.com/oauth2.0/token
    user-info-uri: https://openapi.naver.com/v1/nid/me
    app-deep-link-uri: jjikmeok://oauth/naver

jwt:
  secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  access-token-expiration-ms: 3600000
  refresh-token-expiration-ms: 1209600000

app:
  cors:
    allowed-origins:
      - http://localhost:3000
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    allow-credentials: true
